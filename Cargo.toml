[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lvwxx/callme"

[workspace.dependencies]
callme-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
