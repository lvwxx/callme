[package]
name = "nsh-app-callme"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# nsh from its repository at the revision the `nsh` CLI is built from (the editor is not in a release yet).
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "43026fb27c937fbd5178d401156bd13744550a7c" }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "43026fb27c937fbd5178d401156bd13744550a7c" }
callme-core = { path = "../crates/core" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync"] }
